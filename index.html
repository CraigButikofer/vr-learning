<!DOCTYPE html>
<html>
<head>
    <title>Firewall-Immune ITLS 3D Simulation</title>
    <style>
        /* Build the infinite physical void container */
        body { margin: 0; background-color: #0b0b1a; color: white; font-family: sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; perspective: 800px; }
        
        /* Establish a true spatial coordinate node */
        .stage { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; transform-style: preserve-3d; animation: spinWorld 15s linear infinite; }
        
        /* Create the concrete reference floor grid using pure styling */
        .floor { position: absolute; width: 2000px; height: 2000px; background-image: radial-gradient(#393e46 1px, transparent 1px), radial-gradient(#222831 1px, transparent 1px); background-size: 40px 40px; background-position: 0 0, 20px 20px; transform: rotateX(90deg) translateY(500px); opacity: 0.7; transform-style: preserve-3d; }
        
        /* Central Interactive Learning Object */
        .learning-cube { width: 150px; height: 150px; position: absolute; transform-style: preserve-3d; transform: translateY(-50px); }
        .face { position: absolute; width: 150px; height: 150px; border: 3px solid #00adb5; background: rgba(0, 173, 181, 0.15); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; backface-visibility: visible; }
        
        /* Wrap the surfaces into an explicit 3D mesh volume */
        .front  { transform: translateZ(75px); }
        .back   { transform: rotateY(180deg) translateZ(75px); }
        .left   { transform: rotateY(-90deg) translateZ(75px); }
        .right  { transform: rotateY(90deg) translateZ(75px); }
        .top    { transform: rotateX(90deg) translateZ(75px); }
        .bottom { transform: rotateX(-90deg) translateZ(75px); }

        /* Smooth mechanical continuous rotation loop */
        @keyframes spinWorld {
            0% { transform: rotateY(0deg) rotateX(15deg); }
            100% { transform: rotateY(360deg) rotateX(15deg); }
        }
    </style>
</head>
<body>
    <!-- The Stage contains the spatial environment mapping elements -->
    <div class="stage">
        <div class="floor"></div>
        <div class="learning-cube">
            <div class="face front">ITLS</div>
            <div class="face back">DESIGN</div>
            <div class="face left">VR</div>
            <div class="face right">MEDIA</div>
            <div class="face top">LEARN</div>
            <div class="face bottom">QUEST</div>
        </div>
    </div>
</body>
</html>
