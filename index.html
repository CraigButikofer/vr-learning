<!DOCTYPE html>
<html>
  <head>
    <title>ITLS Spatial Learning Exhibit</title>
    <!-- Secure, production-ready framework link -->
    <script src="https://cloudflare.com"></script>
  </head>
  <body>
    <a-scene>
      <!-- Deep space dark background -->
      <a-sky color="#050510"></a-sky>

      <!-- A faint grid floor for spatial orientation -->
      <a-grid position="0 0 0" src="https://jsdelivr.net" opacity="0.3"></a-grid>

      <!-- Central Learning Object: The Sun -->
      <a-sphere position="0 1.5 -5" radius="1.2" color="#FFD700" 
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
      </a-sphere>

      <!-- Nearby Planet: Mars -->
      <a-sphere position="2.5 1.5 -4" radius="0.3" color="#D34B31"></a-sphere>

      <!-- Nearby Planet: Earth -->
      <a-sphere position="-2 1.5 -4.5" radius="0.4" color="#2E8B57"></a-sphere>

      <!-- Instructional Canvas Text (Mayer's Spatial Contiguity Principle) -->
      <!-- Placing text directly next to 3D objects reduces learner cognitive load -->
      <a-text value="Solar System Scale Model\nUse thumbsticks to walk around." 
              position="-2 3.2 -4" width="5" color="#FFFFFF" align="center">
      </a-text>

      <!-- Camera Rig: Lets you use your controller thumbsticks to walk and look around -->
      
        <a-camera look-controls></a-camera>
        
      
    </a-scene>
  </body>
</html>
