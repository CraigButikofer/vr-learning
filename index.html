<!DOCTYPE html>
<html>
<head>
    <title>ITLS Spatial High Jump Lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Force a clean panoramic split layout across the viewport lenses */
        body { margin: 0; background-color: #020208; color: #ffffff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Dashboard configuration box */
        #coach-hud { background: rgba(0,0,0,0.9); padding: 15px; text-align: center; border-bottom: 2px solid #00adb5; z-index: 99; }
        h2 { margin: 0 0 5px 0; color: #00adb5; font-size: 20px; }
        p { margin: 0; font-size: 13px; color: #ccc; }

        /* The Panorama Canvas Container */
        .panoramic-canvas { display: flex; width: 100vw; height: calc(100vh - 70px); background: #050512; position: relative; }
        
        /* Generate an interactive, self-contained SVG tracking array */
        .lens-projection { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="coach-hud">
        <h2>HIGH JUMP SPATIAL TRACK LAB</h2>
        <p>Use your Quest Browser's native zoom/fullscreen toolbar icon to enter 360° immersion!</p>
    </div>

    <div class="panoramic-canvas">
        <!-- SVG Vector Map simulating a full scale field array without external dependencies -->
        <svg class="lens-projection" viewBox="0 0 1000 500" xmlns="http://w3.org">
            <!-- Sky Void and Track Horizon line -->
            <rect width="1000" height="500" fill="#0c0c1e"/>
            <line x1="0" y1="300" x2="1000" y2="300" stroke="#00adb5" stroke-width="2" opacity="0.3"/>
            
            <!-- Ground Reference Running Track Grids -->
            <path d="M 100,500 L 450,300 M 900,500 L 550,300 M 500,500 L 500,300" stroke="#1c1c3a" stroke-width="3"/>
            <path d="M 0,400 L 1000,400 M 0,450 L 1000,450" stroke="#1c1c3a" stroke-width="2"/>

            <!-- High Jump Landing Pit (Center Profile) -->
            <rect x="350" y="240" width="300" height="80" fill="#0f4c81" rx="5" stroke="#1a73e8" stroke-width="3"/>
            <text x="500" y="285" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" opacity="0.6">MAT / PIT</text>

            <!-- Vertical Standards Uprights -->
            <line x1="330" y1="320" x2="330" y2="100" stroke="#777777" stroke-width="6"/>
            <line x1="670" y1="320" x2="670" y2="100" stroke="#777777" stroke-width="6"/>

            <!-- The Crossbar (Set at an elite visual reference tier) -->
            <line x1="330" y1="140" x2="670" y2="140" stroke="#ffd700" stroke-width="5"/>
            <!-- Glowing crossbar element shadow filter effect -->
            <line x1="330" y1="140" x2="670" y2="140" stroke="#ffaa00" stroke-width="5" stroke-dasharray="5,5" opacity="0.7"/>

            <!-- Left and Right Combined J-Approach Footprint Pathway Overlays -->
            <!-- Left Side Path (White Dots) -->
            <path d="M 150,480 Q 220,400 310,330 T 340,150" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="8,8" opacity="0.5"/>
            <!-- Right Side Path (Neon Blue Dots) -->
            <path d="M 850,480 Q 780,400 690,330 T 660,150" fill="none" stroke="#00adb5" stroke-width="4" stroke-dasharray="8,8" opacity="0.5"/>
            
            <!-- Dynamic Height Grid Indicators -->
            <text x="305" y="145" fill="#ffd700" font-size="12" font-weight="bold" text-anchor="end">2.00m</text>
            <text x="695" y="145" fill="#ffd700" font-size="12" font-weight="bold" text-anchor="start">2.00m</text>
        </svg>
    </div>

</body>
</html>
