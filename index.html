<!DOCTYPE html>
<html>
<head>
    <title>High Jump WebXR Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0b15; font-family: sans-serif; }
        /* Floating Interface Controls on the Web Screen */
        #coach-hud { position: absolute; top: 15px; left: 15px; z-index: 99; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; color: white; border: 1px solid #00adb5; }
        .hud-btn { background: #222; color: #00adb5; border: 1px solid #00adb5; padding: 8px 16px; margin: 4px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .hud-btn:hover { background: #00adb5; color: white; }
        /* Fallback HTML immersion initialization trigger button */
        #vr-trigger-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 99; padding: 16px 32px; background: #e94560; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(233,69,96,0.5); display: none; }
    </style>
    <!-- Single global script source to clear module conflicts and script crashes -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="coach-hud">
        <h3>High Jump Coach Controls</h3>
        <p>Set parameters, then click the pink button below!</p>
        <hr style="border-color:#333;">
        <div>Bar Height: <strong id="height-display" style="color:#00adb5; font-size:18px;">2.00</strong>m</div>
        <button class="hud-btn" id="up-btn">+5 cm</button>
        <button class="hud-btn" id="down-btn">-5 cm</button>
        <br><br>
        <div>Approach Track Pattern:</div>
        <button class="hud-btn" id="left-approach-btn">Left-Side Approach</button>
        <button class="hud-btn" id="right-approach-btn">Right-Side Approach</button>
    </div>

    <button id="vr-trigger-btn">START COACHING SIMULATION</button>

    <script>
        // Non-module global framework execution paths
        let scene, camera, renderer, jApproachLine = null;
        let crossbar, leftStandard, rightStandard;
        let currentHeight = 2.00;

        // 1. Initialize Scene Architecture
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 12, 4);
        scene.add(dirLight);

        // Ground reference tracking grid mesh pattern
        const gridHelper = new THREE.GridHelper(40, 40, 0x00adb5, 0x1c1c28);
        gridHelper.position.y = 0.001;
        scene.add(gridHelper);

        // High Jump Landing Cushion Pit (5m wide x 3m deep x 0.7m high)
        const pitGeo = new THREE.BoxGeometry(5, 0.7, 3);
        const pitMat = new THREE.MeshStandardMaterial({ color: 0x0f4c81, roughness: 0.7 });
        const pit = new THREE.Mesh(pitGeo, pitMat);
        pit.position.set(0, 0.35, -5.5);
        scene.add(pit);

        // Track Standards (Upright posts)
        const standardGeo = new THREE.CylinderGeometry(0.025, 0.025, 2.6, 16);
        const standardMat = new THREE.MeshStandardMaterial({ color: 0x777777, metalness: 0.6 });
        
        leftStandard = new THREE.Mesh(standardGeo, standardMat);
        leftStandard.position.set(-2.0, 1.3, -4.0);
        scene.add(leftStandard);

        rightStandard = new THREE.Mesh(standardGeo, standardMat);
        rightStandard.position.set(2.0, 1.3, -4.0);
        scene.add(rightStandard);

        // The Crossbar
        const barGeo = new THREE.CylinderGeometry(0.015, 0.015, 4.0, 16);
        const barMat = new THREE.MeshStandardMaterial({ color: 0xffd700 });
        crossbar = new THREE.Mesh(barGeo, barMat);
        crossbar.rotation.z = Math.PI / 2;
        crossbar.position.set(0, currentHeight, -4.0);
        scene.add(crossbar);

        // 2. Camera and Rendering Engine Mapping
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; // Auto-wires spatial pipeline bindings directly
        document.body.appendChild(renderer.domElement);

        // 3. System Adjustments Framework Functions
        function adjustBar(amount) {
            currentHeight = Math.max(0.5, Math.min(2.6, currentHeight + amount));
            document.getElementById('height-display').innerText = currentHeight.toFixed(2);
            crossbar.position.set(0, currentHeight, -4.0);
        }

        function setApproach(side) {
            if(jApproachLine) scene.remove(jApproachLine);

            const points = [];
            const segments = 40;
            const startX = side === 'left' ? -6 : 6;
            
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                let x = startX * (1 - t);
                let z = -12 + (8 * t);
                if (t > 0.5) {
                    const curveT = (t - 0.5) * 2;
                    x = (startX * 0.5) * (1 - curveT) + (side === 'left' ? -1.4 : 1.4) * curveT;
                    z = -4.0 - 4.0 * Math.cos(curveT * Math.PI / 2);
                }
                points.push(new THREE.Vector3(x, 0.03, z));
            }

            const curveGeo = new THREE.BufferGeometry().setFromPoints(points);
            const curveMat = new THREE.LineBasicMaterial({ color: 0x00adb5 });
            jApproachLine = new THREE.Line(curveGeo, curveMat);
            scene.add(jApproachLine);
        }

        // Attach layout actions securely to clear inline parsing problems
        document.getElementById('up-btn').addEventListener('click', () => adjustBar(0.05));
        document.getElementById('down-btn').addEventListener('click', () => adjustBar(-0.05));
        document.getElementById('left-approach-btn').addEventListener('click', () => setApproach('left'));
        document.getElementById('right-approach-btn').addEventListener('click', () => setApproach('right'));
        
        setApproach('left');

        // 4. Secure WebXR Device Activation Link Handshake
        const vrTriggerBtn = document.getElementById('vr-trigger-btn');
        
        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-vr').then(function(supported) {
                if (supported) {
                    vrTriggerBtn.style.display = 'block'; // Make button visible only when hardware validation clears
                    vrTriggerBtn.addEventListener('click', enterImmersiveVR);
                } else {
                    vrTriggerBtn.style.display = 'block';
                    vrTriggerBtn.innerText = "XR Hardware Denied By Browser Profile";
                }
            });
        } else {
            vrTriggerBtn.style.display = 'block';
            vrTriggerBtn.innerText = "WebXR Hook Missing In Browser";
        }

        function enterImmersiveVR() {
            navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['local-floor'] }).then(function(session) {
                document.getElementById('coach-hud').style.display = 'none';
                vrTriggerBtn.style.display = 'none';
                renderer.xr.setSession(session);
            }).catch(function(err) {
                alert("VR Initialization Aborted: " + err.message);
            });
        }

        // 5. Stable Rendering Ticker Loop
        renderer.setAnimationLoop(function() {
            renderer.render(scene, camera);
        });

        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
