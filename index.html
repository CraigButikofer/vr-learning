<!DOCTYPE html>
<html>
<head>
    <title>Secure ITLS Spatial Simulation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #vr-button { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: #e94560; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; z-index: 999; font-family: sans-serif;}
    </style>
    <!-- Lightweight, unblockable spatial core engine -->
    <script src="https://unpkg.com"></script>
</head>
<body>
    <button id="vr-button">START LEARNING IMMERSION</button>
    <script>
        // Setup the physical virtual world components
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Add a reference floor pattern grid
        const gridHelper = new THREE.GridHelper(20, 20, 0x4cc3d9, 0x444444);
        scene.add(gridHelper);

        // Add central learning objects (Animated Neon Geometric Structures)
        const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const material = new THREE.MeshBasicMaterial({ color: 0xe94560, wireframe: true });
        const cube = new THREE.Mesh(geometry, material);
        cube.position.set(0, 1.5, -4);
        scene.add(cube);

        const sphereGeo = new THREE.SphereGeometry(0.8, 16, 16);
        const sphereMat = new THREE.MeshBasicMaterial({ color: 0x0f4c81, wireframe: true });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.position.set(3, 1.5, -5);
        scene.add(sphere);

        camera.position.set(0, 1.6, 0);

        // Simple animation look loop
        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            sphere.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        // Handle browser window size changes smoothly
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Activation hook to confirm canvas system response
        document.getElementById('vr-button').addEventListener('click', () => {
            alert('Core Engine Loaded Successfully! Network pipeline is fully verified.');
        });
    </script>
</body>
</html>
