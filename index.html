<!DOCTYPE html>
<html>
  <head>
    <title>ITLS VR Room</title>
    <script src="https://aframe.io"></script>
  </head>
  <body>
    <a-scene font-secret-fix>
      <!-- Clean Blue sky environment -->
      <a-sky color="#A0C4FF"></a-sky>

      <!-- Gray concrete reference ground grid -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#777777"></a-plane>

      <!-- The main instruction block right in front of the camera viewpoint -->
      <a-box position="0 1.5 -3" width="1.5" height="1.5" depth="1.5" color="#FF0055"></a-box>
      
      <!-- Safe lighting setup -->
      
      
    </a-scene>
  </body>
</html>
